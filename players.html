<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Players — Clash of Rackets</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏸</text></svg>">
<link rel="stylesheet" href="css/style.css">
<style>
  .ph{padding:44px 0 8px;}
  .ph h1{font-size:32px;margin:0 0 8px;}
  .ph p.sub{color:var(--ink-3);font-size:14.5px;max-width:60ch;margin:0 0 28px;}
  td.center{text-align:center;}
</style>
</head>
<body>

<nav class="site-nav">
  <div class="wrap">
    <a class="brand" href="index.html">🏸 Clash of Rackets</a>
    <div class="links">
      <a href="index.html">Standings</a>
      <a href="players.html" class="active">Players</a>
      <a href="case-study.html">Case Study</a>
    </div>
  </div>
</nav>

<div class="wrap">
  <div class="ph">
    <h1>Players</h1>
    <p class="sub">Every individual, aggregated across every tournament day. Pair names in the format "A &amp; B" are split into individuals automatically — see the <a href="case-study.html">case study</a> for how the data's put together.</p>
  </div>

  <div class="scroller">
    <table class="rt" id="players-table">
      <thead>
        <tr><th>Player</th><th class="center">Appearances</th><th class="center">Total wins</th><th class="center">Win rate</th><th class="center">Best finish</th><th>Partners</th></tr>
      </thead>
      <tbody id="players-body"></tbody>
    </table>
  </div>

  <footer id="footer"></footer>
</div>

<script src="js/app.js"></script>
<script>
(async function () {
  const tournaments = await loadTournaments();
  const players = playerStats(tournaments);
  document.getElementById('players-body').innerHTML = players.map(p => {
    const partners = [...new Set(p.entries.map(e => e.partner).filter(Boolean))];
    return `<tr>
      <td class="pair">${esc(p.name)}</td>
      <td class="center num">${p.appearances}</td>
      <td class="center num">${p.totalWins}</td>
      <td class="center num">${Math.round(p.winRate * 100)}%</td>
      <td class="center num">${ordinal(p.bestRank)}</td>
      <td>${partners.map(esc).join(', ') || '—'}</td>
    </tr>`;
  }).join('');

  document.getElementById('footer').innerHTML =
    `Computed automatically from <code>data/tournaments/*.json</code> — no manual player list to maintain.`;
})();
</script>
</body>
</html>
